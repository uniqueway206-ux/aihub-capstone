services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["aihub-data:/app/data"]
    restart: unless-stopped
  ui:
    build: .
    command: ["streamlit", "run", "src/aihub/ui/streamlit_app.py",
              "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      API_URL: http://api:8000
    env_file: .env
    ports: ["8501:8501"]
    depends_on: [api]
    healthcheck:
      disable: true
    restart: unless-stopped
volumes:
  aihub-data:
